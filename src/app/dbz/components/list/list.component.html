<h4>LISTADO</h4>
<div>
    <ul *ngFor="let character of characterList; 
    let i = index;
    let isFirst = first;
    let isLast = last;
    let isEven = even;
    let isOdd = odd" class="list-group">

        <li class="list-group-item d-flex justify-content-between align-items-center"
        [ngClass]="{
            'list-group-item-danger': isEven,
            'list-group-item-dark': isLast
            }">
            <span class="text-primary">{{ i + 1 }}. </span>

            <div>
                <span>{{ character.name}} -</span>

                <strong>Power: </strong>    

                <span>{{ character.power }}</span>
            </div>

            <button (click)="emitDeltecharacter(character.id || '')" class="btn btn-danger">
                x
            </button>
        </li>

    </ul>
</div>
