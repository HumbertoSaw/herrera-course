<h4>AGREGAR PERSONAJE</h4>
    <form (ngSubmit)="emitCharacter()" class="row">
        <input [(ngModel)]="character.name" name="name" class="from-control mb-2" type="text" placeholder="Nombre">
        <input [(ngModel)]="character.power" name="power" class="from-control mb-2" type="number" placeholder="Poder">

        <button type="submit" class="btn btn-primary">Agregar</button>
    </form>
